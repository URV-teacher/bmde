# PRs go to master (the default branch) and are reviewed by the CODEOWNERS. Commit messages use the `build` type of
# Conventional Commits, so dependency bumps don't trigger a release on their own.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pip:
        patterns:
          - "*"

  # The base image of every BMDE image. The Dockerfiles of the components live in their own repositories (Dependabot
  # can't update files inside submodules), so they need their own dependabot.yml there.
  - package-ecosystem: "docker"
    directory: "/base"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"

  # Moves the submodules of components/ to the latest commit of each component
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      components:
        patterns:
          - "*"
