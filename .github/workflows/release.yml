# On every push to master, in order, each step only if everything before it succeeded:
#   1. checks: lint (lint.yml), tests (test.yml) and the Docker images, built, tested and pushed with only the tag
#      sha-<commit> (images.yml);
#   2. semantic-release decides from the commits whether there is a new version and, if so, tags it and creates its
#      GitHub release;
#   3. the tested images are published as latest and, if there is a new version, also as X.Y.Z, X.Y and X;
#   4. the package is published to PyPI, only if there is a new version. After the images, because the CLI of a
#      release runs the images tagged with its version, so they must exist before anyone can install it.
# If a step fails, nothing after it is published.
name: release

on:
  push:
    branches:
      - master

# Releases run one at a time, in order, so two pushes can't compute the same version
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  images:
    uses: ./.github/workflows/images.yml
    with:
      candidate: true
    secrets: inherit  # pragma: allowlist secret

  release:
    needs: [lint, test, images]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@github.com"
          commit: false
          push: true

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-26.04
    needs: [release, publish-images]
    # Without a new version the package would get a development version (e.g. 1.13.1.dev7+gffa0227a0), which PyPI
    # rejects
    if: needs.release.outputs.released == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/bmde
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag of the release, so hatch-vcs gives the package exactly its version
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build package
        run: make dist

      # The attestations are signed through the public services of Sigstore, which sometimes fail for a while (e.g. a
      # 502 of Rekor lost the upload of 3.2.0, and a 500 the one of 1.13.0): retry once after a pause
      - name: Publish package distributions to PyPI
        id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

      # The action refuses to sign a package that already has an attestation, as the ones signed before the failure. They
      # are written by its container, as root
      - name: Prepare the retry of the publication
        if: steps.publish.outcome == 'failure'
        run: |
          sudo rm -f dist/*.publish.attestation
          sleep 120

      - name: Retry publishing package distributions to PyPI
        if: steps.publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A file uploaded by the first attempt can't be uploaded again
          skip-existing: true

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-26.04
    needs: release
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Gives the candidate images pushed by images.yml (tag sha-<commit>) the tags of docker-bake.hcl, without
      # rebuilding them: latest and, with VERSION, X.Y.Z, X.Y and X
      - name: Tag the tested images
        env:
          VERSION: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.version || '' }}
          CANDIDATE: sha-${{ github.sha }}
        run: |
          for target in $(docker buildx bake --print | jq -r '.target | keys[]'); do
            source="$(TAG="${CANDIDATE}" VERSION='' docker buildx bake --print "${target}" | jq -r ".target.${target}.tags[0]")"
            args=()
            while read -r tag; do
              args+=(--tag "${tag}")
            done < <(docker buildx bake --print "${target}" | jq -r ".target.${target}.tags[]")
            echo "${source} -> ${args[*]}"
            docker buildx imagetools create "${args[@]}" "${source}"
          done
