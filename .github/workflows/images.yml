# Downloads the assets of the components and builds the Docker images of the BMDE with docker-bake.hcl (the base
# image, the image of each component from the submodules, the full development environment and the development
# environment of the bmde CLI) and runs the tests of every component inside the full development environment.
#
# On pull requests it only builds and tests. On master, release.yml calls it with candidate: true, which pushes the
# tested base image, full development environment and development environment of the CLI to Docker Hub with the tag
# sha-<commit> only; release.yml gives them their public tags (latest and the version) once the release has been made.
# The image of each component is published by the CI of its own repository.
name: Images

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        description: Push the tested images with the tag sha-<commit>, for release.yml to publish them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The cache of GitHub Actions needs the runtime token and URLs of the job, which are only given to actions, not
      # to the run steps that call docker buildx bake
      - name: Expose the GitHub Actions runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      # The slowest assets to download: the sources of Insight, reconstructed from ~900 MB of the CVS repository of
      # sourceware.org, and devkitARM, from a personal mirror. download_assets.sh skips the ones already there after
      # checking their pinned SHA-256, so a stale cache only means downloading them again. The assets that are the
      # latest version of their source (no pinned SHA-256) are left out, so they are still downloaded on every run
      - name: Cache the pinned assets of the components
        uses: actions/cache@v4
        with:
          path: |
            components/insight-docker/assets/insight-7.3.50.20110803-cvs.tar.xz
            components/devkitarm-nds-docker/assets/devkitARM_r46-x86_64-linux.tar.bz2
            components/grit-docker/assets/devkitARM_r46-x86_64-linux.tar.bz2
          key: >-
            component-assets-${{ hashFiles('components/insight-docker/scripts/*.sh',
            'components/devkitarm-nds-docker/scripts/download_assets.sh',
            'components/grit-docker/scripts/download_assets.sh') }}

      # The images are built only from the assets in the assets/ of each component (the sources of Insight are
      # reconstructed from the CVS repository of sourceware.org, with cvs and rsync)
      - name: Download the assets of the components
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cvs rsync
          for script in components/*/scripts/download_assets.sh; do
            echo "::group::${script}"
            if [ "${script}" = components/dlditool-docker/scripts/download_assets.sh ]; then
              # Its test ROM (libfatdir.nds) is built after the images
              "${script}" dlditool-linux-x86_64.zip mpcf.dldi
            else
              "${script}"
            fi
            echo "::endgroup::"
          done

      # With the layer cache of GitHub Actions (see CACHE in docker-bake.hcl), each image only rebuilds what changed.
      # Pull requests read the cache of master and write their own
      - name: Build images
        env:
          CACHE: gha
        run: docker buildx bake full dev --load

      # The test ROM of dlditool is built from the examples of devkitPro, so with the devkitARM just built (in the full
      # development environment) instead of the published one
      - name: Build the test ROM of dlditool
        env:
          DEVKITARM_IMAGE: aleixmt/bmde-full:latest
        run: components/dlditool-docker/scripts/download_assets.sh libfatdir.nds

      - name: Run the tests of the components in the full development environment
        run: shell/test.sh aleixmt/bmde-full:latest

      # The development environment of the CLI only adds packages to the full one: check they work
      - name: Check the development environment of the CLI
        run: |
          docker run --rm --entrypoint bash aleixmt/bmde-dev:latest -c \
            'python3 -m venv /tmp/venv && /tmp/venv/bin/pip --version && command -v mkfs.fat mcopy'

      - name: Log in to Docker Hub
        if: inputs.candidate
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Pushes the images just built and tested (from the cache of buildx) with only the tag sha-<commit>
      - name: Push the candidate images
        if: inputs.candidate
        env:
          TAG: sha-${{ github.sha }}
        run: docker buildx bake --push base full dev
