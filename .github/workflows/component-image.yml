# Reusable workflow for the repositories of the components: builds the Docker image of the component, runs its tests
# inside it and, on the default branch, publishes it. The tests are scripts of scripts/, run with the repository mounted
# in /component (so they can use its data/).
name: Component image

on:
  workflow_call:
    inputs:
      image:
        description: Name of the image, without tag (e.g. aleixmt/desmume)
        required: true
        type: string
      dockerfile:
        description: Dockerfile of the image
        default: Dockerfile
        type: string
      tests:
        description: Test scripts of scripts/ to run inside the image, separated by spaces
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t "${{ inputs.image }}:latest" -f "${{ inputs.dockerfile }}" .

      - name: Run tests inside the image
        run: |
          for test in ${{ inputs.tests }}; do
            echo "::group::${test}"
            docker run --rm --entrypoint bash -v "${PWD}:/component:ro" "${{ inputs.image }}:latest" \
              "/component/scripts/${test}"
            echo "::endgroup::"
          done

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker push "${{ inputs.image }}:latest"
