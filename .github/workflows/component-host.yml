# Reusable workflow for the repositories of the components: downloads its assets and installs the component in an
# Ubuntu machine with its install scripts, as a student would do (see
# docs/getting-started/host_components_installation.md), and runs its tests. Scripts run in login shells, which load
# the environment installed in /etc/profile.d by the previous ones.
name: Component host installation

on:
  workflow_call:
    inputs:
      install:
        description: Install scripts of src/ to run in order, separated by spaces
        required: true
        type: string
      tests:
        description: Test scripts of test/ to run after the installation, separated by spaces
        required: true
        type: string
      setup:
        description: Commands to run before downloading the assets (e.g. to install the tools that download them)
        default: ""
        type: string
      assets:
        description: Assets to download with scripts/download_assets.sh, separated by spaces (all of them by default)
        default: ""
        type: string
      prepare:
        description: >-
          Commands to run after downloading the assets, before the installation (e.g. to build files used by the
          install scripts)
        default: ""
        type: string
      env:
        description: Environment variables for the install scripts, as NAME=VALUE lines
        default: ""
        type: string

jobs:
  host:
    # The Ubuntu versions that docs/getting-started/host_components_installation.md says the scripts are tested on
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Virtual display for the tests of graphical programs
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      # Building and installing only take the assets from assets/, so they are downloaded first
      - name: Download assets
        if: hashFiles('scripts/download_assets.sh') != ''
        run: scripts/download_assets.sh ${{ inputs.assets }}

      - name: Prepare
        if: inputs.prepare != ''
        run: ${{ inputs.prepare }}

      - name: Set environment
        if: inputs.env != ''
        env:
          INSTALL_ENV: ${{ inputs.env }}
        run: printf '%s\n' "${INSTALL_ENV}" >> "${GITHUB_ENV}"

      - name: Install
        run: |
          for script in ${{ inputs.install }}; do
            echo "::group::${script}"
            bash --login "src/${script}"
            echo "::endgroup::"
          done

      - name: Run tests
        run: |
          for test in ${{ inputs.tests }}; do
            echo "::group::${test}"
            bash --login "test/${test}"
            echo "::endgroup::"
          done
