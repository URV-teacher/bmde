name: lint

on:
  pull_request:
  # Called by release.yml on every push to master
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: requirements/*.txt

      - name: Install Dependencies
        run: make install-lint

      - name: Run linters
        run: make lint
