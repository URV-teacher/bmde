name: lint

on:
  pull_request:
  # Called by release.yml on every push to master
  workflow_call:


permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Matches your dev environment
          cache: 'pip' # Speeds up future runs

      - name: Install Dependencies
        run: make dev

      - name: Run Tests
        run: make lint
