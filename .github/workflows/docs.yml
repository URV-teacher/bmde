name: docs
# Builds the project documentation on push to master
# and deploys it to GitHub Pages.

on:
  push:
    branches:
      - 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The docs embed scripts of the components (pymdownx.snippets), which are submodules
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: make install-docs

      - name: Build docs
        run: make docs-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
