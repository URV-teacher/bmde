name: test

on:
  pull_request:
  # Called by release.yml on every push to master
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The integration tests use scripts of the components (e.g. the creation of FAT images of desmume-docker)
      - name: Checkout desmume-docker
        run: git submodule update --init components/desmume-docker

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: requirements/*.txt

      - name: Install Dependencies
        run: make install-test

      # The integration tests create (desmume-docker/scripts/create_fat_image.sh) and read FAT images
      - name: Install FAT tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dosfstools mtools

      - name: Configure BMDE logging
        run: |
          echo "[logging]" > bmde.toml
          echo 'level = "trace"' >> bmde.toml

      - name: Run tests with coverage
        run: XDG_RUNTIME_DIR=/tmp make test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
