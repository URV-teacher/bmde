# Configuration for .github/workflows/labeler.yml

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - "*.md"
      - "docs/**"
      - "mkdocs.yml"

docker:
  - changed-files:
    - any-glob-to-any-file:
      - "**/Dockerfile"
      - "**/*.Dockerfile"
      - "**/.dockerignore"
      - "docker-bake.hcl"
      - "base/**"
      - "shell/**"

python:
  - changed-files:
    - any-glob-to-any-file:
      - "*.py"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

ci:
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "Makefile"
      - ".pre-commit-config.yaml"

components:
  - changed-files:
    - any-glob-to-any-file:
      - "components/**"
