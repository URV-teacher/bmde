# Categories of the notes generated by GitHub ("Generate release notes" when drafting a release by hand). The releases
# published by semantic-release (.github/workflows/release.yml) use its own changelog of Conventional Commits.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📝 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance
      labels:
        - "*"
