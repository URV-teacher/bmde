# This file can be generated with the shell command 'bmde --show-default-config > bmde.toml'
# Options that are commented out are unset by default. Uncomment them to set a value.

# Logging of the CLI.
[logging]
# Verbosity of the CLI output
# Allowed values: trace, debug, info, warning, error, quiet
level = "info"
# Path of the log file. If unset, a new timestamped file is created on each execution in the user log dir
# (~/.local/state/bmde/log on Linux, ~/Library/Logs/bmde on macOS, %LOCALAPPDATA%\bmde\Logs on Windows)
# file = "<user log dir>/<date>.log"
# Hide sensitive values (e.g. passwords) in the logs
hide_sensibles = true

# Docker images of the "docker" backend of every command.
[docker]
# Tag of the Docker images of the tools, to pin a known-good environment (e.g. 1.15.0 or sha-<commit>). If unset, the
# images published with the installed version of bmde, or latest for a development version
# image_tag = "<version of bmde>"

# Settings of the emulator.
[run]
# Method to show the emulator screen with the "docker" backend: a desktop window (host), VNC on port 5900 of localhost
# (vnc) or not shown (none)
# Allowed values: vnc, host, none
graphical_output = "host"
# Enable the GDB stub of the emulator if supported
debug = false
# Port of the GDB stub of the ARM9 processor
arm9_debug_port = 1024
# Path to a FAT image loaded into the emulator
# fat_image = "<path>"
# Play the emulator sound on the host
sound = true
# Path to a DeSmuME desmume.ini with custom controls (and HUD options)
# controls = "<path>"
# Name of the Docker network shared by the emulator and the debugger with the "docker" backend
docker_network = "bmde-debug"

# How the command is executed.
[run.execution_settings]
# Executable used instead of the default entrypoint of the backend
# entrypoint = "<path>"
# Arguments passed to the entrypoint
# arguments = ["<arg>", ...]
# Run the command in the background
background = false
# Simulate actions without executing them
dry_run = false
# Run in interactive mode (allocates a TTY)
interactive = true
# Backend used to execute the command. If unset, the first available backend is used
# Allowed values: host, docker, flatpak
# backend = "<host|docker|flatpak>"

# Settings of the build command.
[build]
# Path to a 32x32 BMP with a palette used as icon of the built .nds instead of the default one of libnds (relative to
# the project directory)
# icon = "<path>"

# How the command is executed.
[build.execution_settings]
# Executable used instead of the default entrypoint of the backend
# entrypoint = "<path>"
# Arguments passed to the entrypoint
# arguments = ["<arg>", ...]
# Run the command in the background
background = false
# Simulate actions without executing them
dry_run = false
# Run in interactive mode (allocates a TTY)
interactive = true
# Backend used to execute the command. If unset, the first available backend is used
# Allowed values: host, docker, flatpak
# backend = "<host|docker|flatpak>"

# Settings of the git command.
[git]

# How the command is executed.
[git.execution_settings]
# Executable used instead of the default entrypoint of the backend
# entrypoint = "<path>"
# Arguments passed to the entrypoint
# arguments = ["<arg>", ...]
# Run the command in the background
background = false
# Simulate actions without executing them
dry_run = false
# Run in interactive mode (allocates a TTY)
interactive = true
# Backend used to execute the command. If unset, the first available backend is used
# Allowed values: host, docker, flatpak
# backend = "<host|docker|flatpak>"

# Identity used in the git commits.
[git.git]
# User name for git commit signature
# name = "<str>"
# User email for git commit signature
# email = "<str>"

# SSH authentication of git.
[git.ssh]
# User name for the SSH authentication of git
# username = "<str>"
# User password for the SSH authentication of git
# password = "<str>"
# Hostname of the SSH server
# host = "<str>"

# VPN (forticlient) used to reach the git server.
[git.vpn]
# Connect to the VPN before running git
enabled = true
# User name for forticlient authentication
# username = "<str>"
# User password for forticlient authentication
# password = "<str>"
# VPN gateway for forticlient
# host = "<str>"
# VPN port for forticlient
# port = <int>
# VPN cert for forticlient
# cert = "<str>"
# VPN realm for forticlient
# realm = "<str>"
# DNS name requested to validate that the internal network is reachable
# test_dns = "<str>"
# IP address requested to validate that the internal network is reachable
# test_ip = "<str>"

