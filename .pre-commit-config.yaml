# The checks of this repository. On `git commit` they only see the staged files (pre-commit hides the unstaged edits),
# and `make lint` (also run by CI) runs them on every tracked file with `pre-commit run --all-files`.
#
# The tools of the public hooks are pinned by `rev` and installed by pre-commit in environments of its own, so they do
# not depend on the venv; Dependabot bumps the revs (.github/dependabot.yml). The local hooks need the project itself
# (its dependencies, or the bmde package), so they call a Makefile target that uses the venv (`make dev`), and only run
# when the files they check change.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--enforce-all]
      # Also outside of a merge, so `make lint` and CI find markers committed by mistake
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--external-sources]

  # Mark a false positive with a `pragma: allowlist secret` comment on its line rather than with a baseline file, which
  # detect-secrets would rewrite every time the line numbers of a known finding shift
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # The commit types decide the next release (python-semantic-release), so a message that is not a Conventional Commit
  # would be left out of the changelog. The types are the ones of .gitmessage; merge, fixup! and squash! commits pass
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, docs, refactor, test, build, ci, chore]

  - repo: local
    hooks:
      # Types cross file boundaries, so mypy checks the whole package whenever a file it depends on changes
      - id: mypy
        name: mypy --strict (make lint-mypy)
        entry: make lint-mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)

      - id: example-config
        name: examples/bmde.toml is up to date (make lint-example-config)
        entry: make lint-example-config
        language: system
        pass_filenames: false
        files: ^(src/|examples/bmde\.toml$)

      - id: ai-ignore
        name: AI ignore files are up to date (make lint-ai-ignore)
        entry: make lint-ai-ignore
        language: system
        pass_filenames: false
        files: ^\.(aiexclude|geminiignore|cursorignore|aiderignore|codeiumignore|aiignore)$

      - id: test
        name: test (make test)
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
