# Every check here just calls a Makefile target - the Makefile is the single place that defines what
# "linted", "formatted" and "tested" mean for this repo, and CI calls the exact same targets (see
# .github/workflows/lint.yml and test.yml).
#
# This means every tool used by a "make ..." hook must already be installed in the project's own venv
# (`make dev`) - pre-commit does not manage separate per-hook environments or version pins for them; those
# versions live solely in the dependency groups of pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: fmt-ruff
        name: fmt-ruff (make fmt-ruff)
        entry: make fmt-ruff
        language: system
        pass_filenames: false

      - id: fmt-ruff-format
        name: fmt-ruff-format (make fmt-ruff-format)
        entry: make fmt-ruff-format
        language: system
        pass_filenames: false

      - id: fmt-hygiene
        name: fmt-hygiene (make fmt-hygiene)
        entry: make fmt-hygiene
        language: system
        pass_filenames: false

      - id: lint-mypy
        name: lint-mypy (make lint-mypy)
        entry: make lint-mypy
        language: system
        pass_filenames: false

      - id: lint-yaml
        name: lint-yaml (make lint-yaml)
        entry: make lint-yaml
        language: system
        pass_filenames: false

      - id: lint-toml
        name: lint-toml (make lint-toml)
        entry: make lint-toml
        language: system
        pass_filenames: false

      - id: lint-large-files
        name: lint-large-files (make lint-large-files)
        entry: make lint-large-files
        language: system
        pass_filenames: false

      - id: lint-merge-conflict
        name: lint-merge-conflict (make lint-merge-conflict)
        entry: make lint-merge-conflict
        language: system
        pass_filenames: false

      - id: lint-case-conflict
        name: lint-case-conflict (make lint-case-conflict)
        entry: make lint-case-conflict
        language: system
        pass_filenames: false

      - id: lint-shellcheck
        name: lint-shellcheck (make lint-shellcheck)
        entry: make lint-shellcheck
        language: system
        pass_filenames: false

      - id: lint-ai-ignore
        name: lint-ai-ignore (make lint-ai-ignore)
        entry: make lint-ai-ignore
        language: system
        pass_filenames: false

      - id: lint-secrets
        name: lint-secrets (make lint-secrets)
        entry: make lint-secrets
        language: system
        pass_filenames: false

      - id: test
        name: test (make test)
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
