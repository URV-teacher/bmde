[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bmde"
dynamic = ["version"]
description = "Bare Metal Development Environment CLI; for NDS development for the practical exercises of Computers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aleix Mariné-Tena", email = "aleix.marine@urv.cat" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["nds", "nintendo-ds", "devkitpro", "devkitarm", "bare-metal", "development-environment", "cli", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "rtoml",
    "pydantic-settings",
    "platformdirs>=4.0"
]

[project.urls]
Homepage = "https://github.com/URV-teacher/bmde"
Documentation = "https://urv-teacher.github.io/bmde/"
Repository = "https://github.com/URV-teacher/bmde"
Issues = "https://github.com/URV-teacher/bmde/issues"

[project.scripts]
bmde = "bmde.__main__:main"

# PEP 735 groups (not extras, so they are not published to PyPI). Each CI job installs only its own group with
# `make install-<group>`; `make dev` installs all of them.
[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
]
# Only the tools that need the project: ruff, shellcheck, detect-secrets and the other checks are pinned in
# .pre-commit-config.yaml, which installs them in environments of its own
lint = [
  "pre-commit",
  "mypy",
]
docs = [
  "mkdocs-material>=9.0.0",
  "mkdocs>=1.5.0",
  "pymdown-extensions>=10.0",
  "mkdocstrings[python]",
  "mkdocs-autorefs",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-typer2",
  "mkdocs-include-markdown-plugin",
]
dev = [
  "build",
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "docs" },
]

[tool.hatch.version]
source = "vcs"

# hatchling ignores MANIFEST.in and would otherwise put every non-ignored file in the sdist, including the
# checkouts of the submodules in components/ (hundreds of MB once their assets are downloaded)
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

# The version comes from the git tag (hatch-vcs), so semantic-release only has to tag and publish the GitHub release
# (commit: false in .github/workflows/release.yml). Commits follow Conventional Commits: feat bumps the minor, fix and
# perf the patch, and a `!` after the type or a BREAKING CHANGE footer the major.
[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["bmde"]
omit = ["*/bmde/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Every line and branch is covered (by tests/unit alone, without Docker): new code needs its tests
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 120
target-version = "py311"
# The submodules have linters of their own
extend-exclude = ["components"]

[tool.ruff.lint]
select = ["E", "F", "D", "B", "I", "UP", "SIM", "S", "TRY", "DTZ", "PL", "N", "RUF", "ARG"]
ignore = [
    # Docstrings are checked for style where they exist, but not every module, class and function needs one
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Commands import their backends lazily so that `bmde --help` does not load every tool
    "PLC0415",
    # bmde runs docker, git and the other tools on purpose, found in the PATH, with arguments built from its options
    "S603", "S607",
    # The errors are raised with a message that explains the situation to the user, not with an exception class each
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Typer turns each argument into a CLI option, and the command layer receives them one by one to build the spec
"src/bmde/**/cli.py" = ["PLR0913", "PLR0917"]
"src/bmde/commands/*/command.py" = ["PLR0913", "PLR0917"]
"src/bmde/core/cli_global.py" = ["PLR0913", "PLR0917"]
# pytest uses plain asserts, and tests compare against literal values, use fake credentials and write to temporary paths.
# Their fakes keep the signature of what they replace and their fixtures are often requested only for their side effects
"tests/**" = ["S101", "S105", "S108", "PLR2004", "D", "ARG"]

[tool.ruff.format]
line-ending = "lf"
